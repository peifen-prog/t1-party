<script>
'use strict';
 
/* =====================================================================
   0. 影片切換
   ===================================================================== */
let currentPlatform = 'yt';
 
function switchPlatform(platform) {
  currentPlatform = platform;
  const ytPlayer = document.getElementById('yt-player');
  const twitchPlayer = document.getElementById('twitch-player');
  const btnYt = document.getElementById('btn-yt');
  const btnTwitch = document.getElementById('btn-twitch');
 
  if (platform === 'yt') {
    ytPlayer.classList.remove('hidden');
    twitchPlayer.classList.add('hidden');
    btnYt.classList.add('active');
    btnTwitch.classList.remove('active');
  } else {
    ytPlayer.classList.add('hidden');
    twitchPlayer.classList.remove('hidden');
    btnTwitch.classList.add('active');
    btnYt.classList.remove('active');
  }
}
 
function changeStream() {
  const input = document.getElementById('video-input').value.trim();
  if (!input) return;
 
  if (currentPlatform === 'yt') {
    let videoId = input;
    if (input.includes('v=')) {
      videoId = input.split('v=')[1].split('&')[0];
    } else if (input.includes('youtu.be/')) {
      videoId = input.split('youtu.be/')[1].split('?')[0];
    } else if (input.includes('embed/')) {
      videoId = input.split('embed/')[1].split('?')[0];
    }
    document.getElementById('yt-player').src = `https://www.youtube.com/embed/${videoId}`;
  } else {
    const hasChinese = /[\u4e00-\u9fa5]/.test(input);
    if (hasChinese) {
      window.open(`https://www.twitch.tv/search?term=${encodeURIComponent(input)}`, '_blank');
    } else {
      let channel = input.replace('https://www.twitch.tv/', '').trim();
      if (channel.includes('?')) {
        channel = channel.split('?')[0];
      }
      document.getElementById('twitch-player').src = `https://player.twitch.tv/?channel=${channel}&parent=peifen-prog.github.io&parent=localhost&parent=127.0.0.1`;
    }
  }
}
 
/* =====================================================================
   1. 設定與共用工具
   ===================================================================== */
const CFG = {
  SW: 24, SH: 13.5, SY: 9.25,
  ROWS: 4, COLS: 10,
  R0: 16, ROW_D: 2.2,
  STEP: 0.15, AISLE: 0.07,
  ZMIN: 5, RMAX: 26,
  SPEED: 5
};
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const limit = (x, z) => {
  x = clamp(x, -24, 24); z = Math.max(z, CFG.ZMIN);
  const r = Math.hypot(x, z);
  if (r > CFG.RMAX) { x *= CFG.RMAX / r; z = Math.max(CFG.ZMIN, z * CFG.RMAX / r); }
  return { x, z };
};
const wrapPI = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
 
const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, d) { (this.h[e] || []).forEach(f => f(d)); }
};
 
function box(w, h, d, color, x, y, z, parent, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z); (parent || Engine.scene).add(m); return m;
}
function roundRect(x, a, b, w, h, r) {
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}
function textSprite(txt, o = {}) {
  const { color = '#f0e6d2', border = '#c8aa6e', size = 36, h = 56, sc = 0.55 } = o;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = `bold ${size}px "Microsoft JhengHei", Arial, sans-serif`;
  x.font = font; const w = Math.ceil(x.measureText(txt).width) + 40;
  c.width = w; c.height = h; x.font = font;
  x.fillStyle = 'rgba(9,20,40,.88)'; roundRect(x, 2, 2, w - 4, h - 4, 14); x.fill();
  x.lineWidth = 3; x.strokeStyle = border; x.stroke();
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, w / 2, h / 2 + 2);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  s.scale.set(sc * w / h, sc, 1); s.renderOrder = 10; return s;
}
 
/* =====================================================================
   2. Engine: 雙渲染器、OrbitControls、主迴圈
   ===================================================================== */
const Engine = (() => {
  const viewport = $('#viewport'), stage = $('#stage');
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x050b18, 55, 130);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
  camera.position.set(0, 14, 38);
 
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  const cssR = new THREE.CSS3DRenderer();
  Object.assign(cssR.domElement.style, { position: 'absolute', top: '0', left: '0', zIndex: '0' });
  Object.assign(renderer.domElement.style, { position: 'absolute', top: '0', left: '0', zIndex: '1', pointerEvents: 'none' });
  viewport.append(cssR.domElement, renderer.domElement);
 
  const controls = new THREE.OrbitControls(camera, viewport);
  controls.target.set(0, 6, 10);
  controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 6; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.autoRotateSpeed = 1.2;
  controls.update();
 
  viewport.addEventListener('pointerdown', () => viewport.classList.add('dragging'));
  addEventListener('pointerup', () => viewport.classList.remove('dragging'));
 
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h); cssR.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();
 
  const tickers = [], clock = new THREE.Clock();
  function start() {
    (function loop() {
      const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
      controls.update();
      tickers.forEach(f => f(dt, t));
      cssR.render(scene, camera); renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
  }
  return { scene, camera, controls, viewport, onTick: f => tickers.push(f), start };
})();
 
/* =====================================================================
   3. Venue: 場館與座位
   ===================================================================== */
const Venue = (() => {
  const { SW, SH, SY, ROWS, COLS, R0, ROW_D, STEP, AISLE } = CFG, scene = Engine.scene;
  const walkables = [], seats = [], seatMeshes = [];
  const rowH = i => (i + 1) * 0.4;
  const SPAN = 4.5 * STEP + AISLE + 0.12;
  const seatAngle = c => (c - 4.5) * STEP + (c < 5 ? -AISLE : AISLE);
 
  const neon = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } }, side: THREE.DoubleSide,
    vertexShader: 'varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'uniform float uTime; varying vec3 vP; void main(){ float h = fract((vP.x + vP.y * 1.3 + vP.z * 0.5) * 0.045 - uTime * 0.25); vec3 c = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); gl_FragColor = vec4(mix(vec3(0.72), c, 0.55) * 0.95, 1.0); }'
  });
  let lights = [];
 
  function build() {
    scene.add(new THREE.AmbientLight(0x8fa8d0, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(8, 25, 20); scene.add(sun);
    lights = [[-14, 10, 6], [14, 10, 6], [0, 18, 8]].map(p => {
      const l = new THREE.PointLight(0xffffff, 1.0, 60); l.position.set(...p); scene.add(l); return l;
    });
 
    const floor = new THREE.Mesh(new THREE.CircleGeometry(80, 64), new THREE.MeshLambertMaterial({ color: 0x0b1626 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor); walkables.push(floor);
    const grid = new THREE.GridHelper(160, 80, 0x1e3a5f, 0x10233b); grid.position.y = 0.02; scene.add(grid);
    const ring = new THREE.Mesh(new THREE.RingGeometry(30, 30.4, 96), neon);
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04; scene.add(ring);
 
    box(SW + 4, 1.2, 6, 0x141c2b, 0, 0.6, 1.5);
    box(SW + 4, 0.14, 0.14, 0, 0, 1.25, 4.5, scene, neon);
 
    box(SW + 1, SH + 1, 0.6, 0x0a0f18, 0, SY, -0.4);
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH),
      new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0, blending: THREE.NoBlending }));
    hole.position.set(0, SY, 0.02); scene.add(hole);
    const embed = new THREE.CSS3DObject($('#screen-embed'));
    embed.position.set(0, SY, 0); embed.scale.setScalar(SW / 1280); scene.add(embed);
    box(SW + 1.6, 0.4, 0.7, 0, 0, SY + SH / 2 + 0.6, 0.1, scene, neon);
    box(SW + 1.6, 0.4, 0.7, 0, 0, SY - SH / 2 - 0.6, 0.1, scene, neon);
    box(0.4, SH + 1.6, 0.7, 0, -(SW / 2 + 0.6), SY, 0.1, scene, neon);
    box(0.4, SH + 1.6, 0.7, 0, SW / 2 + 0.6, SY, 0.1, scene, neon);

    [-1, 1].forEach(sd => {
      const m = new THREE.Mesh(new THREE.ConeGeometry(3.2, 24, 24, 1, true), new THREE.MeshBasicMaterial({
        color: sd < 0 ? 0xff8fa3 : 0x8fcfff, transparent: true, opacity: 0.07,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      m.position.set(sd * (SW / 2 + 3), 11, 5); m.rotation.x = -0.5; scene.add(m);
    });
 
    const BLUE = 0x3d8bff;
    const glowTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(80,150,255,.55)'); g.addColorStop(0.55, 'rgba(60,120,255,.3)'); g.addColorStop(1, 'rgba(40,100,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
    })();
    const glowMat = () => new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(SW + 16, SH + 12), glowMat()); halo.position.set(0, SY, -1); scene.add(halo);
    [-1, 1].forEach(sd => box(0.25, SH + 3, 0.25, BLUE, sd * (SW / 2 + 2.4), SY, 0.1, scene, new THREE.MeshBasicMaterial({ color: BLUE })));
    const fg = new THREE.Mesh(new THREE.PlaneGeometry(44, 16), glowMat());
    fg.rotation.x = -Math.PI / 2; fg.position.set(0, 0.06, 8); scene.add(fg);
    
    const ringGlow = (rIn, rOut, a0, len, dir) => {
      const m = new THREE.Mesh(new THREE.RingGeometry(rIn, rOut, 96, 1, a0, len), new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
        uniforms: { uIn: { value: rIn }, uOut: { value: rOut }, uDir: { value: dir } },
        vertexShader: 'varying float vR; void main(){ vR = length(position.xy); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: 'uniform float uIn; uniform float uOut; uniform float uDir; varying float vR; void main(){ float t = clamp((vR - uIn) / (uOut - uIn), 0.0, 1.0); if (uDir < 0.0) t = 1.0 - t; gl_FragColor = vec4(0.24, 0.55, 1.0, pow(1.0 - t, 2.0) * 0.5); }'
      }));
      m.rotation.x = -Math.PI / 2; m.position.y = 0.05; scene.add(m);
    };
    
    ringGlow(30, 37, 0, Math.PI * 2, 1);
    ringGlow(26, 30, 0, Math.PI * 2, -1);
    for (let k = 0; k < 16; k++) {
      const a = k / 16 * Math.PI * 2;
      const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 12, 8, 1, true), new THREE.MeshBasicMaterial({
        color: BLUE, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
      pil.position.set(32 * Math.sin(a), 6, 32 * Math.cos(a)); scene.add(pil);
    }
    
    const sa0 = -SPAN - Math.PI / 2;
    ringGlow(R0 + (ROWS - 1) * ROW_D + ROW_D / 2, R0 + (ROWS - 1) * ROW_D + ROW_D / 2 + 3.5, sa0, SPAN * 2, 1);
    ringGlow(R0 - ROW_D / 2 - 3, R0 - ROW_D / 2, sa0, SPAN * 2, -1);
    [[0, 7, 3], [-16, 5, 12], [16, 5, 12]].forEach(q => {
      const l = new THREE.PointLight(BLUE, 0.6, 45); l.position.set(...q); scene.add(l);
    });
 
    for (let r = 0; r < ROWS; r++) {
      const R = R0 + r * ROW_D, h = rowH(r), a0 = -SPAN - Math.PI / 2, a1 = SPAN - Math.PI / 2;
      const shape = new THREE.Shape();
      shape.absarc(0, 0, R + ROW_D / 2, a0, a1, false);
      shape.absarc(0, 0, R - ROW_D / 2, a1, a0, true);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 48 });
      geo.rotateX(-Math.PI / 2);
      const plat = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x172234, side: THREE.DoubleSide }));
      scene.add(plat); walkables.push(plat);
      const edge = new THREE.Mesh(new THREE.RingGeometry(R - ROW_D / 2 - 0.1, R - ROW_D / 2, 64, 1, a0, a1 - a0), neon);
      edge.rotation.x = -Math.PI / 2; edge.position.y = h + 0.02; scene.add(edge);
      const blueLine = new THREE.Mesh(new THREE.RingGeometry(R + ROW_D / 2 - 0.15, R + ROW_D / 2, 64, 1, a0, a1 - a0),
        new THREE.MeshBasicMaterial({ color: BLUE, side: THREE.DoubleSide }));
      blueLine.rotation.x = -Math.PI / 2; blueLine.position.y = h + 0.02; scene.add(blueLine);
 
      for (let c = 0; c < COLS; c++) {
        const th = seatAngle(c), sn = Math.sin(th), cs = Math.cos(th), x = R * sn, z = R * cs;
        const g = new THREE.Group(); g.position.set(x, h, z); g.rotation.y = th; scene.add(g);
        const seat = { x, z, y: h, row: r, col: c, id: seats.length, occ: null, yaw: th, sn, cs };
        const pad = box(1.2, 0.2, 1.0, 0xb3162d, 0, 0.4, 0, g);
        const back = box(1.2, 1.0, 0.18, 0x2a2f3a, 0, 0.95, 0.52, g);
        const leg = box(0.2, 0.3, 0.2, 0x444b57, 0, 0.15, 0, g);
        seat.mat = pad.material;
        [pad, back, leg].forEach(m => { m.userData.seat = seat; seatMeshes.push(m); });
        seats.push(seat);
      }
    }
  }
  function groundY(x, z) {
    const r = Math.hypot(x, z), th = Math.atan2(x, z);
    if (z <= 0 || Math.abs(th) > SPAN) return 0;
    const i = Math.floor((r - (R0 - ROW_D / 2)) / ROW_D);
    return i < 0 || i >= ROWS ? 0 : rowH(i);
  }
  function tick(dt, t) {
    neon.uniforms.uTime.value = t;
    lights.forEach((l, i) => l.color.setHSL((t * 0.1 + i / 3) % 1, 0.55, 0.6));
  }
  return { build, tick, groundY, walkables, seats, seatMeshes };
})();
 
/* =====================================================================
   4. Seats: 座位狀態管理
   ===================================================================== */
const Seats = (() => {
  const FREE = 0xb3162d, TAKEN = 0xc8aa6e;
  const front = s => ({ x: s.x - 0.85 * s.sn, z: s.z - 0.85 * s.cs });
  const paint = s => { s.mat.color.setHex(s.occ ? TAKEN : FREE); s.mat.emissive.setHex(s.occ ? 0x5a4310 : 0); };
  const taken = (s, o) => !!s.occ && s.occ !== o;
  
  function sit(o, s) {
    if (taken(s, o)) return false;
    if (o.seat) stand(o);
    s.occ = o; o.seat = s; o.lastSeat = s; o.target = null; o.pending = null; o.yawT = s.yaw;
    paint(s); Bus.emit('seats'); return true;
  }
  
  function stand(o) {
    const s = o.seat; if (!s) return;
    const f = front(s); o.x = f.x; o.z = f.z; s.occ = null; o.seat = null;
    paint(s); Bus.emit('seats');
  }
  
  const count = () => Venue.seats.filter(s => s.occ).length;
  return { front, sit, stand, taken, count, paint };
})();
 
/* =====================================================================
   5. Avatar: 角色模型建構
   ===================================================================== */
const Avatar = (() => {
  const SKIN = 0xf1c9a5, BLACK = 0x15171c, RED = 0xe2012d, GOLD = 0xc8aa6e;
  function badge(txt, w, h) {
    const c = document.createElement('canvas'); c.width = 128; c.height = 96;
    const x = c.getContext('2d');
    x.font = '900 70px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = 8; x.strokeStyle = '#e2012d'; x.strokeText(txt, 64, 52);
    x.fillStyle = '#c8aa6e'; x.fillText(txt, 64, 52);
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  }
  function build(gender) {
    const f = gender === 'f', g = new THREE.Group();
    const tw = f ? 0.44 : 0.58, td = f ? 0.28 : 0.32, ax = f ? 0.31 : 0.41, aw = f ? 0.11 : 0.14, lw = f ? 0.17 : 0.22;
    const hair = f ? 0x4a2a1c : 0x15120f;
 
    box(tw, 0.66, td, BLACK, 0, 1.18, 0, g);
    box(0.07, 0.66, td + 0.02, RED, 0, 1.18, 0, g);
    box(tw + 0.02, 0.07, td + 0.02, GOLD, 0, 1.5, 0, g);
    box(tw + 0.02, 0.06, td + 0.02, GOLD, 0, 0.88, 0, g);
    const fb = badge('T1', 0.2, 0.15); fb.position.set(-tw * 0.25, 1.32, -(td / 2 + 0.013)); fb.rotation.y = Math.PI; g.add(fb);
    const bb = badge('T1', 0.38, 0.29); bb.position.set(0, 1.27, td / 2 + 0.013); g.add(bb);
 
    if (f) { box(tw + 0.2, 0.22, td + 0.1, BLACK, 0, 0.84, 0, g); box(tw + 0.22, 0.04, td + 0.12, RED, 0, 0.73, 0, g); }
    else box(tw, 0.2, td, BLACK, 0, 0.9, 0, g);
 
    const head = new THREE.Mesh(new THREE.SphereGeometry(f ? 0.21 : 0.22, 16, 12), new THREE.MeshLambertMaterial({ color: SKIN }));
    head.position.y = f ? 1.71 : 1.72; g.add(head);
    box(0.05, 0.07, 0.03, 0x111111, -0.08, 1.74, -0.2, g);
    box(0.05, 0.07, 0.03, 0x111111, 0.08, 1.74, -0.2, g);
    box(0.46, 0.13, 0.46, hair, 0, 1.9, 0.01, g);
    if (f) {
      box(0.44, 0.08, 0.06, hair, 0, 1.84, -0.21, g);
      box(0.5, 0.62, 0.12, hair, 0, 1.5, 0.2, g);
      box(0.47, 0.04, 0.47, RED, 0, 1.86, 0, g);
    } else {
      box(0.46, 0.22, 0.1, hair, 0, 1.76, 0.2, g);
    }
 
    const leg = x => {
      const h = new THREE.Group(); h.position.set(x, 0.85, 0); g.add(h);
      box(lw, 0.4, lw, BLACK, 0, -0.2, 0, h);
      const k = new THREE.Group(); k.position.y = -0.4; h.add(k);
      box(lw - 0.02, 0.4, lw - 0.02, BLACK, 0, -0.2, 0, k);
      box(lw, 0.1, 0.28, RED, 0, -0.42, -0.04, k);
      return { h, k };
    };
    const arm = x => {
      const a = new THREE.Group(); a.position.set(x, 1.45, 0); g.add(a);
      box(aw, 0.42, aw, BLACK, 0, -0.21, 0, a);
      box(aw + 0.01, 0.1, aw + 0.01, RED, 0, -0.46, 0, a);
      box(aw - 0.02, 0.1, aw - 0.02, SKIN, 0, -0.56, 0, a);
      return a;
    };
    g.userData = { legL: leg(-lw * 0.6), legR: leg(lw * 0.6), armL: arm(-ax), armR: arm(ax) };
    return g;
  }
  return { build };
})();
 
/* =====================================================================
   6. Actors: 角色邏輯 (管理本地與網路上的所有玩家)
   ===================================================================== */
let me = null;
const Actors = (() => {
  const map = new Map(); // id -> actor
  const list = [];
  const STYLE = {
    chat: { color: '#ffffff', border: '#c8aa6e', size: 38, h: 60, sc: 0.62 },
    cheer: { color: '#f5d98a', border: '#c8aa6e', size: 44, h: 72, sc: 0.75 }
  };

  function skin(o) {
    if (o.g) Engine.scene.remove(o.g);
    o.bubbles = [];
    o.g = Avatar.build(o.gender);
    const lab = textSprite(o.name); lab.position.y = 2.5; o.g.add(lab);
    Engine.scene.add(o.g);
  }

  function make(id, name, gender, x, z) {
    const o = {
      id, name, gender, x, z, yCur: Venue.groundY(x, z), yaw: 0, yawT: 0,
      target: null, pending: null, seat: null, lastSeat: null, sitT: 0,
      phase: 0, walk: 0, bubbles: []
    };
    skin(o);
    map.set(id, o);
    list.push(o);
    return o;
  }

  function remove(id) {
    const o = map.get(id);
    if (!o) return;
    if (o.seat) Seats.stand(o);
    if (o.g) Engine.scene.remove(o.g);
    map.delete(id);
    const idx = list.indexOf(o);
    if (idx !== -1) list.splice(idx, 1);
  }

  function bubble(o, msg, kind) {
    const text = msg.length > 20 ? msg.slice(0, 20) + '…' : msg;
    const s = textSprite(text, STYLE[kind || 'chat']);
    o.g.add(s); o.bubbles.unshift({ s, t: 0 });
    if (o.bubbles.length > 4) o.g.remove(o.bubbles.pop().s);
  }

  function tickBubbles(o, dt) {
    for (let i = o.bubbles.length - 1; i >= 0; i--) {
      const b = o.bubbles[i]; b.t += dt;
      b.s.position.y = 3.2 + i * 0.8 + b.t * 0.12;
      b.s.material.opacity = b.t > 4.2 ? Math.max(0, 1 - (b.t - 4.2) / 0.6) : 1;
      if (b.t > 4.8) { o.g.remove(b.s); b.s.material.map.dispose(); b.s.material.dispose(); o.bubbles.splice(i, 1); }
    }
  }

  function step(o, dt, dir) {
    o.sitT = clamp(o.sitT + (o.seat ? 1 : -1) * dt * 3, 0, 1);
    let moving = false;
    if (!o.seat && o.sitT < 0.02) {
      let dx = 0, dz = 0, st = CFG.SPEED * dt;
      if (dir) { dx = dir.x; dz = dir.z; }
      else if (o.target) {
        const ex = o.target.x - o.x, ez = o.target.z - o.z, d = Math.hypot(ex, ez);
        if (d < 0.1) {
          o.target = null;
          if (o.pending) {
            const s = o.pending; o.pending = null;
            if (Seats.sit(o, s)) {
              if (o === me) Socket.emitSit(s.id);
            } else if (o === me) {
              UI.toast('這個座位剛被人坐走了');
            }
          }
        } else { dx = ex / d; dz = ez / d; st = Math.min(st, d); }
      }
      if (dx || dz) {
        const np = limit(o.x + dx * st, o.z + dz * st); o.x = np.x; o.z = np.z;
        o.yawT = Math.atan2(-dx, -dz); moving = true;
      }
    }
    const sitting = o.seat || o.sitT > 0;
    o.yaw += wrapPI((sitting ? (o.lastSeat ? o.lastSeat.yaw : 0) : o.yawT) - o.yaw) * Math.min(1, dt * 10);
    o.yCur += (Venue.groundY(o.x, o.z) - o.yCur) * Math.min(1, dt * 14);
 
    const e = o.sitT * o.sitT * (3 - 2 * o.sitT);
    let px = o.x, pz = o.z, py = o.yCur;
    if (o.lastSeat && e > 0) {
      const s = o.lastSeat;
      px += (s.x + 0.1 * s.sn - o.x) * e; pz += (s.z + 0.1 * s.cs - o.z) * e; py += (s.y - 0.32 - o.yCur) * e;
    }
    o.walk += ((moving ? 1 : 0) - o.walk) * Math.min(1, dt * 10);
    if (moving) o.phase += dt * 10;
    const sw = Math.sin(o.phase) * 0.8 * o.walk * (1 - e), H = Math.PI / 2;
    py += Math.abs(Math.sin(o.phase)) * 0.05 * o.walk;
    o.g.position.set(px, py, pz); o.g.rotation.y = o.yaw;
    const p = o.g.userData;
    p.legL.h.rotation.x = sw + e * H; p.legR.h.rotation.x = -sw + e * H;
    p.legL.k.rotation.x = p.legR.k.rotation.x = -e * H;
    p.armL.rotation.x = -sw - e * 0.4; p.armR.rotation.x = sw - e * 0.4;
    tickBubbles(o, dt);
  }

  return { map, list, make, remove, skin, bubble, step };
})();

/* =====================================================================
   6.5 Socket: 即時連線網路模組
   ===================================================================== */
const Socket = (() => {
  let ioSocket = null;
  let moveTimer = 0;

  function init() {
    // 預設連接當前主機 (支援 localhost 與正式伺服器部署)
    ioSocket = io('https://t1-party.onrender.com');

    // 收到當前房間所有人資料
    ioSocket.on('current_players', (players) => {
      for (const id in players) {
        if (id === ioSocket.id) continue;
        const p = players[id];
        const actor = Actors.make(p.id, p.name, p.gender, p.x, p.z);
        if (p.seatId !== null && Venue.seats[p.seatId]) {
          Seats.sit(actor, Venue.seats[p.seatId]);
        }
      }
    });

    // 新玩家加入
    ioSocket.on('player_joined', (p) => {
      if (p.id === ioSocket.id) return;
      Actors.make(p.id, p.name, p.gender, p.x, p.z);
      Chat.add('', `${p.name} 進入了影廳`, true);
    });

    // 其他玩家移動
    ioSocket.on('player_moved', (data) => {
      const actor = Actors.map.get(data.id);
      if (actor) {
        if (actor.seat) Seats.stand(actor);
        actor.target = { x: data.x, z: data.z };
        actor.yawT = data.yaw;
      }
    });

    // 其他玩家坐下
    ioSocket.on('player_sat', (data) => {
      const actor = Actors.map.get(data.id);
      const seat = Venue.seats[data.seatId];
      if (actor && seat) {
        Seats.sit(actor, seat);
      }
    });

    // 其他玩家起立
    ioSocket.on('player_stood', (data) => {
      const actor = Actors.map.get(data.id);
      if (actor) {
        Seats.stand(actor);
        if (data.x !== undefined && data.z !== undefined) {
          actor.x = data.x; actor.z = data.z;
        }
      }
    });

    // 其他玩家發言/應援
    ioSocket.on('player_spoken', (data) => {
      const actor = Actors.map.get(data.id);
      if (actor) {
        Actors.bubble(actor, data.msg, data.kind);
        if (data.kind === 'chat') {
          Chat.add(data.name, data.msg);
        } else if (data.kind === 'cheer') {
          FX.burst({ x: actor.g.position.x, y: actor.g.position.y + 1.4, z: actor.g.position.z }, data.fx);
        }
      }
    });

    // 其他玩家更新暱稱/性別
    ioSocket.on('profile_updated', (data) => {
      const actor = Actors.map.get(data.id);
      if (actor) {
        actor.name = data.name;
        actor.gender = data.gender;
        Actors.skin(actor);
      }
    });

    // 玩家離線
    ioSocket.on('player_left', (data) => {
      Actors.remove(data.id);
      Chat.add('', `${data.name || '一名玩家'} 離開了影廳`, true);
    });
  }

  function join(name, gender) {
    if (!ioSocket) init();
    ioSocket.emit('join_room', { name, gender, x: me.x, z: me.z, yaw: me.yaw });
  }

  function updateMove(dt) {
    if (!me || !ioSocket) return;
    moveTimer += dt;
    // 每 0.1 秒向後端同步一次座標，節省頻寬
    if (moveTimer > 0.1 && (me.target || me.walk > 0.1)) {
      moveTimer = 0;
      ioSocket.emit('player_move', { x: me.x, z: me.z, yaw: me.yaw });
    }
  }

  function emitSit(seatId) {
    if (ioSocket) ioSocket.emit('player_sit', { seatId, x: me.x, z: me.z });
  }

  function emitStand() {
    if (ioSocket) ioSocket.emit('player_stand', { x: me.x, z: me.z });
  }

  function emitSpeak(msg, kind, fx) {
    if (ioSocket) ioSocket.emit('player_speak', { msg, kind, fx });
  }

  function emitProfile(name, gender) {
    if (ioSocket) ioSocket.emit('update_profile', { name, gender });
  }

  return { init, join, updateMove, emitSit, emitStand, emitSpeak, emitProfile };
})();
 
/* =====================================================================
   7. FX: 特效系統
   ===================================================================== */
const FX = (() => {
  const N = 900;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), base = new Float32Array(N * 3),
        vel = new Float32Array(N * 3), life = new Float32Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.45, map: new THREE.CanvasTexture(c), vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  pts.frustumCulled = false; Engine.scene.add(pts);
 
  const PAL = { gold: [[1, 0.85, 0.35], [1, 0.62, 0.12], [1, 0.95, 0.7]], red: [[1, 0.12, 0.2], [1, 0.5, 0.35], [1, 0.92, 0.9]],
                mix: [[1, 0.85, 0.35], [1, 0.15, 0.2], [1, 0.95, 0.75]] };
  let head = 0; const tmp = new THREE.Color();
  function burst(o, kind) {
    const big = kind === 'rainbow', n = big ? 200 : 110;
    for (let k = 0; k < n; k++) {
      const i = head++ % N, a = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1, r = Math.sqrt(1 - u * u);
      const sp = 3 + Math.random() * (big ? 7 : 5);
      pos.set([o.x, o.y, o.z], i * 3);
      vel.set([Math.cos(a) * r * sp, u * sp + 2, Math.sin(a) * r * sp], i * 3);
      if (big) { tmp.setHSL(Math.random(), 0.65, 0.68); base.set([tmp.r, tmp.g, tmp.b], i * 3); }
      else base.set(PAL[kind || 'gold'][k % 3], i * 3);
      life[i] = 1 + Math.random() * 0.7;
    }
  }
  function tick(dt) {
    for (let i = 0; i < N; i++) {
      const j = i * 3;
      if (life[i] > 0) {
        life[i] -= dt; vel[j + 1] -= 7 * dt; vel[j] *= 0.985; vel[j + 2] *= 0.985;
        pos[j] += vel[j] * dt; pos[j + 1] += vel[j + 1] * dt; pos[j + 2] += vel[j + 2] * dt;
        const f = clamp(life[i], 0, 1);
        col[j] = base[j] * f; col[j + 1] = base[j + 1] * f; col[j + 2] = base[j + 2] * f;
      } else { col[j] = col[j + 1] = col[j + 2] = 0; }
    }
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  }
  return { burst, tick };
})();
 
/* =====================================================================
   8. Chat: 聊天室 (對接 Socket.io)
   ===================================================================== */
const Chat = (() => {
  const log = $('#chat-log'), input = $('#chat-input');
  function add(name, text, sys) {
    const d = document.createElement('div');
    if (sys) { d.className = 'sys'; d.textContent = text; }
    else { const b = document.createElement('b'); b.textContent = name; d.append(b, document.createTextNode(text)); }
    log.appendChild(d);
    while (log.children.length > 80) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }
  function send() {
    const text = input.value.trim(); if (!text) return;
    if (!me) { UI.toast('請先進入影廳'); return; }
    input.value = '';
    add(me.name, text); Actors.bubble(me, text, 'chat');
    Socket.emitSpeak(text, 'chat', null);
  }
  $('#chat-send').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });
  return { add };
})();
 
/* =====================================================================
   9. Player: 控制與動作同步
   ===================================================================== */
const Player = (() => {
  const keys = {}, KEYS = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
                            ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  const v = new THREE.Vector3(), ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
 
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || !me) return;
    if (KEYS[e.key]) { keys[KEYS[e.key]] = true; e.preventDefault(); }
    if (e.key === 'e' || e.key === 'E') toggleSit();
  });
  addEventListener('keyup', e => { if (KEYS[e.key]) keys[KEYS[e.key]] = false; });
 
  function keyDir() {
    const mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), mz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (!mx && !mz) return null;
    Engine.camera.getWorldDirection(v);
    const l = Math.hypot(v.x, v.z) || 1, fx = v.x / l, fz = v.z / l;
    const dx = -fz * mx - fx * mz, dz = fx * mx - fz * mz, n = Math.hypot(dx, dz) || 1;
    return { x: dx / n, z: dz / n };
  }

  function goToSeat(s) {
    if (!me || me.seat === s) return;
    if (Seats.taken(s, me)) { UI.toast('這個座位已經有人了'); return; }
    if (me.seat) {
      Seats.stand(me);
      Socket.emitStand();
    }
    me.target = Seats.front(s); me.pending = s;
  }

  function toggleSit() {
    if (!me) return;
    if (me.seat) {
      Seats.stand(me);
      Socket.emitStand();
      return;
    }
    let best = null, bd = 1e9;
    for (const s of Venue.seats) {
      if (Seats.taken(s, me)) continue;
      const f = Seats.front(s), d = Math.hypot(f.x - me.x, f.z - me.z);
      if (d < bd) { bd = d; best = s; }
    }
    if (best && bd < 4.5) goToSeat(best); else UI.toast('附近沒有空位,先走到座位區或直接點座位');
  }

  function cheer(msg, fx) {
    if (!me) { UI.toast('請先進入影廳'); return; }
    Actors.bubble(me, msg, 'cheer');
    FX.burst({ x: me.g.position.x, y: me.g.position.y + 1.4, z: me.g.position.z }, fx);
    Socket.emitSpeak(msg, 'cheer', fx);
  }
 
  let down = null;
  Engine.viewport.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  Engine.viewport.addEventListener('pointerup', e => {
    if (!down || !me) return;
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
    const r = Engine.viewport.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, Engine.camera);
    const hit = ray.intersectObjects([...Venue.seatMeshes, ...Venue.walkables])[0];
    if (!hit) return;
    if (hit.object.userData.seat) { goToSeat(hit.object.userData.seat); return; }
    if (me.seat) {
      Seats.stand(me);
      Socket.emitStand();
    }
    me.pending = null;
    me.target = limit(hit.point.x, hit.point.z);
  });
 
  $('#sit-btn').addEventListener('click', toggleSit);
  document.querySelectorAll('.cheer-btn[data-msg]').forEach(b =>
    b.addEventListener('click', () => cheer(b.dataset.msg, b.dataset.fx)));
 
  function tick(dt) {
    const dir = keyDir();
    if (me) {
      if (dir) {
        if (me.seat) {
          Seats.stand(me);
          Socket.emitStand();
        }
        me.target = null; me.pending = null;
      }
      Actors.step(me, dt, dir);
      Socket.updateMove(dt);

      const label = me.seat ? '🧍 起立' : '🪑 坐下';
      if ($('#sit-btn').textContent !== label) $('#sit-btn').textContent = label;
    }
    Actors.list.forEach(o => { if (o !== me) Actors.step(o, dt, null); });
  }
  return { tick };
})();
 
/* =====================================================================
   11. UI 管理
   ===================================================================== */
const UI = (() => {
  let gender = 'm', toastT;
  const panel = $('#profile'), nameInput = $('#name-input');
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2400);
  }
  function setGender(g) {
    gender = g;
    panel.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
  }
  function enter() {
    const name = nameInput.value.trim().slice(0, 12) || ('Fan' + (100 + Math.floor(Math.random() * 900)));
    if (!me) {
      const myTempId = 'local_me';
      me = Actors.make(myTempId, name, gender, (Math.random() - 0.5) * 10, 7 + Math.random() * 2);
      Socket.join(name, gender);
      Chat.add('', `${name} 進入了影廳`, true);
      toast('點座位入座、點地面行走,拖曳畫面可 360° 環繞');
    } else {
      me.name = name; me.gender = gender; Actors.skin(me);
      Socket.emitProfile(name, gender);
      toast('角色已更新');
    }
    $('#enter-btn').textContent = '更新角色';
    panel.classList.add('hidden');
  }
  panel.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setGender(b.dataset.g)));
  $('#enter-btn').addEventListener('click', enter);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) enter(); });
  $('#btn-profile').addEventListener('click', () => {
    if (me) { nameInput.value = me.name; setGender(me.gender); }
    panel.classList.toggle('hidden');
  });
  $('#btn-rotate').addEventListener('click', () => {
    Engine.controls.autoRotate = !Engine.controls.autoRotate;
    $('#btn-rotate').classList.toggle('active', Engine.controls.autoRotate);
  });
  const info = () => $('#info').textContent = `🪑 座位 ${Seats.count()} / ${Venue.seats.length} 已佔用`;
  Bus.on('seats', info);
  return { toast, info };
})();
 
/* =====================================================================
   12. 啟動引擎
   ===================================================================== */
Venue.build();
UI.info();
Engine.onTick(Venue.tick);
Engine.onTick(FX.tick);
Engine.onTick(Player.tick);
Engine.start();
</script>
